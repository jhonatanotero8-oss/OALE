function PDFW(){
 const PW=595.28,PH=841.89,ML=40,MR=40,MT=40,MB=50;
 const pages=[];let ops=null;const cv=document.createElement('canvas').getContext('2d');
 const wid=(t,sz,b)=>{cv.font=(b?'bold ':'')+sz+'px Helvetica, Arial, sans-serif';return cv.measureText(t).width};
 const SP={8211:150,8212:151,8216:145,8217:146,8220:147,8221:148,8226:149,8364:128,183:183};
 const enc=t=>{let o='';for(const ch of String(t)){let c=ch.codePointAt(0);if(SP[c])c=SP[c];else if(c>255)c=63;const s=String.fromCharCode(c);o+=(s==='('||s===')'||s==='\\')?'\\'+s:s}return o};
 const col=h=>{h=h.replace('#','');return [0,2,4].map(i=>(parseInt(h.slice(i,i+2),16)/255).toFixed(3)).join(' ')};
 const api={PW,PH,ML,MR,MT,MB,y:MT,wid,
  page(){ops=[];pages.push(ops);api.y=MT},
  text(x,y,t,sz,o={}){const w=wid(t,sz,o.b);if(o.align==='right')x=x-w;else if(o.align==='center')x=x-w/2;
   ops.push(`BT /${o.b?'F2':'F1'} ${sz} Tf ${col(o.c||'#22302a')} rg ${x.toFixed(2)} ${(PH-y).toFixed(2)} Td (${enc(t)}) Tj ET`);return w},
  rect(x,y,w,h,fill,stroke){let s='';if(fill)s+=`${col(fill)} rg `;if(stroke)s+=`${col(stroke)} RG 0.8 w `;
   ops.push(s+`${x.toFixed(2)} ${(PH-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${fill&&stroke?'B':fill?'f':'S'}`)},
  line(x1,y1,x2,y2,c,w){ops.push(`${col(c||'#cccccc')} RG ${w||0.6} w ${x1.toFixed(2)} ${(PH-y1).toFixed(2)} m ${x2.toFixed(2)} ${(PH-y2).toFixed(2)} l S`)},
  wrap(t,sz,maxw,b){const out=[];String(t).split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const test=line?line+' '+w:w;if(wid(test,sz,b)>maxw&&line){out.push(line);line=w}else line=test});out.push(line)});return out},
  ensure(h){if(api.y+h>PH-MB)api.page()},
  count(){return pages.length},
  addFooters(txt){pages.forEach((p,i)=>{ops=p;api.line(ML,PH-38,PW-MR,PH-38,'#cfd8d2',0.6);api.text(ML,PH-26,txt,8,{c:'#52615a'});api.text(PW-MR,PH-26,'Página '+(i+1)+' de '+pages.length,8,{c:'#52615a',align:'right'})})},
  build(title){
   const objs=[];const add=s=>{objs.push(s);return objs.length};
   add('<< /Type /Catalog /Pages 2 0 R >>');add('PAGES');
   add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
   add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
   const kids=[];
   pages.forEach(p=>{const st=p.join('\n');const cid=objs.length+2;
    const pid=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`);kids.push(pid+' 0 R');
    add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`)});
   objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
   const info=add(`<< /Title (${enc(title)}) /Producer (OALE) >>`);
   let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
   objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
   const xr=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xr}\n%%EOF`;
   const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u}
 };
 api.page();return api;
}

 const k=cacheOk(c.cache)?c.cache:null,age=k?Date.now()-k.t:Infinity,nom=esc(String(c.nombre).split(',')[0].trim());
 if(!k)return wrap('old',`<span class="hsl"><small class="hsk">Clima en ${nom}</small><b class="hsq">Toque para consultarlo</b></span><span class="hsic">${CLF.nube}</span>`);
 if(S.cerr||age>=3*3600e3)return wrap('old',`<span class="hsl"><small class="hsk">Clima en ${nom}</small><b class="hsq">Dato guardado ${haceTxt(age)}</b><small>No es el de ahora. Toque para actualizar.</small></span><span class="hsic">${CLF.nube}</span>`);
 const th=skyTheme(k,false),txt=wmoInfo(k.cur.code)[0],i=k.daily.time.indexOf(todayStr()),pr=i>=0?k.daily.pprob[i]:null,alto=pr!=null&&pr>=60;
 return wrap(th,`<span class="hsl"><small class="hsk">Hoy en ${nom}</small><span class="hsrow"><b class="hst">${Math.round(k.cur.temp)}°</b><span class="hsc">${txt}</span></span><span class="hchip${alto?' hi':''}">${pr==null?'Lluvia: no disponible':(alto?'Es probable que llueva hoy · ':'Lluvia hoy: ')+pr+' %'}</span></span><span class="hsic">${CLF[iconFor(k.cur.code,k.cur.day)]}</span>`);
}



/* ===== TIENDAS CERCA DE LA FINCA (del mapa abierto OpenStreetMap; se descargan aparte una vez por semana) ===== */
const OSM_KEY='OALE_osm_v1';
function osmData(){try{const j=JSON.parse(localStorage.getItem(OSM_KEY)||'null');return j&&Array.isArray(j.lugares)&&j.lugares.length?j:null}catch(e){return null}}
async function osmLive(){
 if(!navigator.onLine)return;
 try{
  const r=await fetch('proveedores_osm.json?'+Math.floor(Date.now()/3600000),{cache:'no-store'});if(!r.ok)return;
  const j=await r.json();if(!j||!Array.isArray(j.lugares))return;
  const cur=osmData();if(cur&&cur.actualizado===j.actualizado&&cur.lugares.length===j.lugares.length)return;
  try{localStorage.setItem(OSM_KEY,JSON.stringify(j))}catch(e){return}
  if(S.tab==='cafe'&&S.sub==='prov'&&$('pvNear'))pvRefresh();
 }catch(e){}
}
function telHref(t){const d=telDig(t);return d.length===12&&d.startsWith('57')?'+'+d:d}
function kmEntre(la1,lo1,la2,lo2){const r=x=>x*Math.PI/180,dl=r(la2-la1),dn=r(lo2-lo1),h=Math.sin(dl/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function kmTxt(k){return k<1?'menos de 1 km':(k<10?num(Math.round(k*10)/10):num(Math.round(k)))+' km'}
function osmCerca(){
 const c=CLM(),d=osmData();if(!c||c.lat==null||!d)return null;
 const q=nrm(S.pvq||''),cat=S.pvc||'',rad=S.pvr||40;
 return d.lugares.map(x=>Object.assign({},x,{km:kmEntre(c.lat,c.lon,x.lat,x.lon)}))
  .filter(x=>x.km<=rad&&(!cat||x.categoria===cat)&&(!q||nrm([x.nombre,PV_CATS[x.categoria]||'',x.direccion,x.ciudad].concat(x.productos||[]).join(' ')).includes(q)))
  .sort((a,b)=>a.km-b.km).slice(0,25);
}
function osmCard(x){
 const wa=waNum(x.telefono),tel=telHref(x.telefono);
 return `<div class="pvcard osm"><div class="pvh"><b>${esc(x.nombre)}</b><span class="pvcat">${esc(PV_CATS[x.categoria]||'Otro')}</span></div>
 <small>A ${kmTxt(x.km)}${x.direccion?' · '+esc(x.direccion):''}${x.ciudad?' · '+esc(x.ciudad):''}</small>
 ${(x.productos||[]).length?`<div class="pvprods">Vende: ${x.productos.map(esc).join(', ')}</div>`:''}
 <div class="pvb"><em class="tag cal">Tomada de un mapa · sin verificar</em></div>
 <div class="pvbtns">${tel?`<a class="btn sm" href="tel:${tel}">Llamar</a>`:''}${wa?`<a class="btn sm" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>`:''}<a class="btn sec sm" href="https://www.google.com/maps/search/?api=1&query=${x.lat},${x.lon}" target="_blank" rel="noopener">Cómo llegar</a><button type="button" class="btn sec sm" data-c="osmsave" data-id="${esc(x.id)}">Guardar</button></div></div>`;
}
function lugarPickHTML(titulo,texto){
 return `<div class="card"><b>${titulo}</b><p class="cfline" style="font-size:16px">${texto}</p>
 <input class="f big" id="clQ" type="search" autocomplete="off" placeholder="Ej. Pitalito" style="font-size:20px">
 <button class="btn" data-c="clsearch">Buscar municipio</button><div id="clRes"></div>
 <button class="btn sec" data-c="clgeo">Usar la ubicación de mi celular</button>
 <p class="note">Necesita internet para buscar. Su ubicación se queda en este celular.</p>${CLM()&&CLM().lat!=null?'<button class="btn sec" data-c="clback">Cancelar</button>':''}</div>`;
}
function pvNearHTML(){
 const c=CLM();
 if(!c||c.lat==null||S.clchg)return lugarPickHTML('Tiendas cerca de su finca','Escoja su municipio y le mostramos las tiendas de abonos, semillas y herramientas que aparecen en el mapa.');
 const nom=esc(String(c.nombre).split(',')[0].trim()),d=osmData();
 const gq=encodeURIComponent('tienda agropecuaria insumos agrícolas '+(c.nombre&&c.nombre!=='Mi ubicación'?'cerca de '+c.nombre:'cerca de mí')),
  gm=`<a class="btn sec gmaps" href="https://www.google.com/maps/search/?api=1&query=${gq}" target="_blank" rel="noopener">Buscar también en Google Maps</a>`;
 const cab=`<div class="pvnh"><h2 class="t" style="margin:0">Cerca de ${nom}</h2><button type="button" class="link" data-c="clchg">Cambiar lugar</button></div>`;
 if(!d)return cab+`<div class="cfhint">Todavía no hay datos del mapa en este celular. Se descargan solos cuando hay internet.</div>`+gm;
 const rad=S.pvr||40,arr=osmCerca();
 const chips=`<div class="pchips" style="margin:8px 0 2px">${[15,40,100].map(r=>`<button type="button" class="pchip ${rad===r?'on':''}" data-c="pvrad" data-v="${r}">Hasta ${r} km</button>`).join('')}</div>`;
 const lista=arr.length?arr.map(osmCard).join(''):`<div class="cfhint">No aparece ninguna tienda en el mapa a menos de ${rad} km${S.pvq||S.pvc?' con esa búsqueda':''}. En zonas del campo el mapa todavía no tiene todos los negocios: pruebe con más kilómetros o agregue las que usted conozca.</div>`;
 return cab+chips+lista+gm+`<p class="note">Datos del mapa <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="color:#066a48;font-weight:700">© OpenStreetMap</a>${d.actualizado?' · bajados el '+pvFecha(d.actualizado):''}. Pueden estar incompletos o viejos: llame antes de ir.</p>`;
}
function pvRefresh(){const n=$('pvNear');if(n)n.innerHTML=pvNearHTML();const l=$('pvList');if(l)l.innerHTML=pvListHTML()}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-c="pvrad"],[data-c="osmsave"]');if(!el)return;
 if(el.dataset.c==='pvrad'){S.pvr=Number(el.dataset.v);pvRefresh();return}
 const d=osmData(),x=d&&d.lugares.find(z=>z.id===el.dataset.id);if(!x)return;
 if(PVL().some(p=>p.osmId===x.id))return toast('Ya la tiene guardada en sus tiendas');
 PVL().push({id:Date.now(),osmId:x.id,nombre:x.nombre,categoria:x.categoria,municipio:x.ciudad||'',direccion:x.direccion||'',telefono:x.telefono||'',productos:(x.productos||[]).map(n=>({nombre:n,precio:null,unidad:'',fecha_precio:null})),horario:'',horario_confirmado:false,nota:'Tomada de un mapa (OpenStreetMap). Confirme los datos llamando.'});
 save(true);pvRefresh();toast('✓ Guardada en sus tiendas');
});

function adelSet(w,pid,arr){const e=w.extra[pid]||(w.extra[pid]={});e.adel=arr;const t=arr.reduce((x,a)=>x+(Number(a.v)||0),0);e.desc=t>0?String(Math.round(t)):''}
function adelFechaNueva(){return (cur===isoKey(new Date()))?todayStr():dayDate(cur,0).toISOString().slice(0,10)}
function adelFecha(f){const d=new Date(f+'T00:00:00Z');return isNaN(d)?'':DSEM[d.getUTCDay()]+' '+shortDate(d).replace(' de ',' ')}
function adelHTML(p){
 const L=adelOf(W(),p.id);
 return `<h2 class="t">Adelantos</h2>
 <div class="card adc"><div class="adh"><span>Total adelantado</span><b id="adTot">${fmt(L.reduce((x,a)=>x+(Number(a.v)||0),0))}</b><button class="addr" type="button" data-a="addadel" data-pid="${p.id}" aria-label="Agregar un adelanto">＋</button></div>
 ${L.length?L.map((a,j)=>`<div class="adrow"><span class="adf">${a.n?esc(a.n):a.f?esc(adelFecha(a.f)):'Anterior'}</span><input class="f" id="ad${p.id}_${j}" type="text" inputmode="numeric" autocomplete="off" placeholder="$ 0" aria-label="Adelanto ${j+1}" data-adel="${p.id}:${j}" value="${Number(a.v)>0?esc(fmt(a.v)):''}"><button class="px2" type="button" data-a="deladel" data-pid="${p.id}" data-j="${j}" aria-label="Quitar adelanto ${j+1}">✕</button></div>`).join(''):'<p class="note" style="margin:8px 2px 0">Toque ＋ cada vez que le dé plata adelantada. Se descuenta sola al pagar.</p>'}</div>`;
}


/* ===== Deudas: quien se adelantó más de lo que ha cogido ===== */
function deudaSemana(pid,k=cur){const n=calc(pid,k).net;return n<0?Math.round(-n):0}
function deudaPrevia(pid,hasta=cur){let t=0;Object.keys(db.weeks).sort().forEach(k=>{if(k>=hasta)return;const e=(db.weeks[k]&&db.weeks[k].extra&&db.weeks[k].extra[pid])||{};if(e.pasada)return;const n=calc(pid,k).net;if(n<0)t+=-n});return Math.round(t)}
function deudores(){const out=[];db.people.forEach(p=>{const sem=deudaSemana(p.id),prev=deudaPrevia(p.id);if(sem>0||prev>0)out.push({p,sem,prev})});return out}
function debTag(p,ds){try{const kk=isoKey(new Date(ds+'T12:00:00')),d=deudaSemana(p.id,kk)+deudaPrevia(p.id,kk);return d>0?'<small class="debtag">Debe '+fmt(d)+'</small>':''}catch(e){return ''}}
function debePrevHTML(p){const d=deudaPrevia(p.id);return d>0?`<div class="alert red debe"><b>⚠ ${esc(p.name)} debe ${fmt(d)} de semanas anteriores.</b><button class="btn sm" type="button" data-a="pasardeuda" data-pid="${p.id}">Descontarlo esta semana</button></div>`:''}
function debtAlertHTML(){const L=deudores();if(!L.length)return '';return `<div class="alert red debe noprint"><b>⚠ ${L.length===1?'1 persona debe plata':L.length+' personas deben plata'} a la finca</b>${L.map(d=>`<button class="dline" type="button" data-a="goto" data-tab="people" data-sub="detail" data-pid="${d.p.id}"><span>${esc(d.p.name)}${d.sem&&d.prev?'':d.prev?' <small>(semanas anteriores)</small>':' <small>(esta semana)</small>'}</span><b>Debe ${fmt(d.sem+d.prev)} ›</b></button>`).join('')}</div>`}


/* ===== Mi cosecha de café: se suma sola la cosecha de todos los cosechadores ===== */
/* día con el que queda anotada la cogida de una semana: el último día de esa semana con kilos; si no hay, el último día de la semana que ya pasó (o hoy) */
function cogFechaSem(key){const hoy=todayStr();try{for(let ix=6;ix>=0;ix--){const dd=dayDate(key,ix).toISOString().slice(0,10);if(dd<=hoy&&db.people.some(p=>kgDay(p.id,dd)>0))return dd}}catch(e){}const dom=dayDate(key,6).toISOString().slice(0,10);return dom<hoy?dom:hoy}
function cogSemMover(dir){const cf=$('cf');if(!cf)return;const key=dateInfo(cf.value||todayStr()).key,nk=dateInfo(new Date(dayDate(key,0).getTime()+dir*7*86400000).toISOString().slice(0,10)).key;if(dir>0&&nk>dateInfo(todayStr()).key)return;cf.value=cogFechaSem(nk);$('cfText').textContent=wkRel(nk);$('cfSub').textContent='Del '+wkDias(nk);const cm=$('cm'),cl=$('cl');if(cm){cm.dataset.auto='1'}if(cl&&cl.dataset.bultos!=='1'){cl.value=''}S.cgbAll=false;S.cgbSel=0;bultosPintar();cogSync(true)}
function cogKgDia(ds){try{return Math.round(totals(dateInfo(ds).key).kg*100)/100}catch(e){return 0}}
function cogKgSem(ds){try{return Math.round(totals(dateInfo(ds).key).kg*100)/100}catch(e){return 0}}
function cogYaAnotado(ds){const key=dateInfo(ds).key;return CFd().cog.filter(x=>x&&typeof x.f==='string'&&dateInfo(x.f).key===key).reduce((a,x)=>a+(Number(x.m)||0),0)}
function cogResto(ds){return Math.max(0,Math.round((cogKgDia(ds)-cogYaAnotado(ds))*100)/100)}
/* nombre de la semana para frases: "esta semana", "la semana pasada" o "la semana del 28 sep al 4 oct" */
function cogSemNom(key){const n=Math.round((dayDate(key,0).getTime()-dayDate(isoKey(new Date()),0).getTime())/(7*86400000));return n===0?'esta semana':n===-1?'la semana pasada':'la semana del '+wkCorto(key)}
function cogPuenteHTML(ds){
 const t=cogKgDia(ds);if(t<=0)return '';
 const key=dateInfo(ds).key,nom=cogSemNom(key),n=Math.round((dayDate(key,0).getTime()-dayDate(isoKey(new Date()),0).getTime())/(7*86400000)),ya=cogYaAnotado(ds),rest=cogResto(ds),cm=$('cm'),nl=bultosLav().length;
 if(rest<=0)return `<small class="cgnota">✓ Todo lo de ${nom} ya está anotado (${num(t)} kg).</small>`;
 const pre=nl>1?'Hay '+nl+' lavadas esta semana: escriba cuánto café maduro entró en la lavada '+(bultosSel()+1)+'. ':'';
 const igual=cm&&Math.abs(pnum(cm.value)-rest)<0.005;
 const base=pre+(ya>0?'Faltan por anotar '+num(rest)+' kg de los '+num(t)+' kg de '+nom+'.':'Kilos totales de '+nom+(n===0||n===-1?' ('+wkCorto(key)+')':'')+': '+num(t)+' kg.');
 return `<small class="cgnota">${igual&&ya===0&&nl<=1?'✓ ':''}${base}${igual?'':' <button type="button" class="link" data-c="cogsumar">Usar '+num(rest)+' kg</button>'}</small>`;
}
/* semanas (las últimas 5) que todavía tienen kilos de cosechadores sin pasar a una cogida; d = día sugerido, k = semana, r = kilos que faltan */
function cogPend(){const out=[],hoy=todayStr();for(let i=0;i<5;i++){const key=dateInfo(addD(hoy,-7*i)).key,fd=cogFechaSem(key),r=cogResto(fd);if(r<=0)continue;out.push({d:fd,k:key,r})}return out}
/* la pantalla se abre en la última semana que tenga kilos por anotar (si no hay, en hoy) */
function cogDefaultDay(){
 try{const c=CFd(),ks=new Set(),hay=l=>Array.isArray(l)?l.some(hay):Number(l)>0;
  [c.bultosL,c.bultosW].forEach(o=>{if(o&&typeof o==='object'&&!Array.isArray(o))Object.keys(o).forEach(k=>{if(hay(o[k]))ks.add(k)})});
  const L=[...ks].filter(k=>/^\d{4}-W\d{2}$/.test(k)).sort();if(L.length)return cogFechaSem(L[L.length-1])}catch(e){}
 const L=cogPend();return L.length?L[0].d:todayStr()}
function cogSync(auto){
 const cf=$('cf'),box=$('cgPuente');if(!cf||!box||!cf.value)return;
 const ds=cf.value,cm=$('cm'),rest=cogResto(ds);
 if(auto&&cm){
  if(rest>0&&(!cm.value||cm.dataset.auto==='1')){cm.value=String(rest).replace('.',',');cm.dataset.auto='1';cogLive()}
  else if(rest<=0&&cm.dataset.auto==='1'){cm.value='';cm.dataset.auto='';cogLive()}
 }
 box.innerHTML=cogPuenteHTML(ds);
}
document.addEventListener('input',e=>{if(e.target.id==='cm'){e.target.dataset.auto='';cogSync(false)}});
document.addEventListener('click',e=>{
 if(e.target.closest('[data-c="cfprev"],[data-c="cfnext"]')&&$('cgPuente')){cogSemMover(e.target.closest('[data-c="cfprev"],[data-c="cfnext"]').dataset.c==='cfprev'?-1:1);return}
 const el=e.target.closest('[data-c="cogsumar"]');if(!el)return;
 const ds=$('cf').value,r=cogResto(ds);if(r>0){$('cm').value=String(r).replace('.',',');$('cm').dataset.auto='1';cogLive();cogSync(false)}
});
document.addEventListener('change',e=>{if(e.target.id==='cf'&&$('cgPuente'))cogSync(true)});


/* ===== Bultos de pergamino lavado: una casilla, el total y los últimos pesos. La semana puede tener varias lavadas; todo queda guardado hasta guardar la cogida ===== */
function bultosKey(){const cf=$('cf');try{return dateInfo((cf&&cf.value)||todayStr()).key}catch(e){return isoKey(new Date())}}
/* lavadas de la semana que se ve: cada lavada es una lista de pesos */
function bultosLav(){
 const c=CFd(),k=bultosKey();
 if(!c.bultosL||typeof c.bultosL!=='object'||Array.isArray(c.bultosL))c.bultosL={};
 if(c.bultosW&&typeof c.bultosW==='object'&&!Array.isArray(c.bultosW)){Object.keys(c.bultosW).forEach(w=>{const a=c.bultosW[w];if(Array.isArray(a)&&a.length){if(!Array.isArray(c.bultosL[w]))c.bultosL[w]=[];c.bultosL[w].push(a)}})}
 if('bultosW' in c)delete c.bultosW;
 if(Array.isArray(c.bultosB)&&c.bultosB.length){if(!Array.isArray(c.bultosL[k]))c.bultosL[k]=[];c.bultosL[k].push(c.bultosB)}
 if('bultosB' in c)delete c.bultosB;
 let L=c.bultosL[k];if(!Array.isArray(L)){L=[];c.bultosL[k]=L}
 /* si quedó una lista suelta de pesos, pasa a ser una lavada */
 if(L.some(x=>!Array.isArray(x))){const sueltos=L.filter(x=>!Array.isArray(x)),listas=L.filter(Array.isArray);L.length=0;if(sueltos.length)L.push(sueltos);listas.forEach(l=>L.push(l))}
 /* se limpian los pesos en su sitio (así siempre se trabaja sobre la lista real, no sobre una copia) */
 L.forEach(l=>{for(let i=l.length-1;i>=0;i--){const n=Number(l[i]);if(n>0)l[i]=n;else l.splice(i,1)}});
 if(!L.length)L.push([]);
 return L;
}
function bultosSel(L){L=L||bultosLav();let i=Number(S.cgbSel)||0;if(i<0||i>=L.length)i=L.length-1;if(i<0)i=0;S.cgbSel=i;return i}
function bultosArr(){const L=bultosLav();return L[bultosSel(L)]}
function bultosVals(){return bultosArr().slice()}
/* al guardar la cogida se quita esa lavada (si era la única, solo se vacía) */
function bultosQuitarLavada(){const L=bultosLav(),i=bultosSel(L);if(L.length>1){L.splice(i,1);S.cgbSel=Math.min(i,L.length-1)}else L[0].length=0}
function cogLavadaTxt(x){try{const k=dateInfo(x.f).key,mis=CFd().cog.filter(y=>y&&typeof y.f==='string'&&dateInfo(y.f).key===k).sort((a,b)=>(a.id||0)-(b.id||0));return mis.length>1?'Lavada '+(mis.indexOf(x)+1):''}catch(e){return ''}}
function bultosLinea(x){const b=Array.isArray(x.bultos)?x.bultos.filter(n=>Number(n)>0):[];return b.length?`<div class="cgbl">${b.length} ${b.length===1?'bulto':'bultos'}: ${b.map(n=>num(n)).join(' · ')} kg</div>`:''}
function bultosCard(){return `<div class="card cgb2c noprint" id="cgBultos"><div class="cgb-h"><b>Bultos de pergamino lavado</b><small>Pese cada bulto antes del secadero y anótelo aquí. Quedan guardados hasta que guarde la cogida.</small></div>
 <div class="cgb-lav" id="cgbLav"></div>
 <div class="cgb-add"><input id="cgbIn" class="f" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="Peso del bulto en kg" aria-label="Peso del bulto en kilos"><button type="button" class="cgb-plus" data-c="bultoadd" aria-label="Agregar el bulto">＋</button></div>
 <div class="cgb-res" id="cgbRes"></div><div class="cgb-chips" id="cgbChips"></div><div class="cgb-act" id="cgbAct"></div></div>`}
function bultosPintar(){
 const res=$('cgbRes');if(!res)return;
 const L=bultosLav(),sel=bultosSel(L),a=L[sel],sum=Math.round(a.reduce((x,n)=>x+n,0)*100)/100,todos=!!S.cgbAll||a.length<=8,ini=todos?0:a.length-8;
 const tot=L.reduce((x,l)=>x+l.reduce((y,n)=>y+n,0),0),nt=L.reduce((x,l)=>x+l.length,0);
 $('cgbLav').innerHTML=L.length>1?L.map((l,i)=>`<button type="button" class="cgb-lp${i===sel?' on':''}" data-c="lavsel" data-i="${i}">Lavada ${i+1}<small>${l.length} ${l.length===1?'bulto':'bultos'}</small></button>`).join('')+'<button type="button" class="cgb-lp new" data-c="lavnew">＋ Otra lavada</button>':'';
 res.innerHTML=(a.length?`${L.length>1?'<span class="mut">Lavada '+(sel+1)+' · </span>':''}<b>${a.length} ${a.length===1?'bulto':'bultos'}</b> · ${num(sum)} kg`:`<span class="mut">${L.length>1?'Lavada '+(sel+1)+': todavía':'Todavía'} no hay bultos anotados.</span>`)+(L.length>1?`<div class="cgb-sem">Toda la semana: ${nt} ${nt===1?'bulto':'bultos'} · ${num(Math.round(tot*100)/100)} kg en ${L.length} lavadas</div>`:'');
 $('cgbChips').innerHTML=a.slice(ini).map((n,k)=>`<button type="button" class="cgb-chip" data-c="bultodel" data-i="${ini+k}" aria-label="Quitar el bulto ${ini+k+1} de ${num(n)} kilos">${num(n)}<i>✕</i></button>`).join('');
 $('cgbAct').innerHTML=(a.length?`<button type="button" class="link" data-c="bultoundo">↶ Deshacer el último</button>${a.length>8?`<button type="button" class="link" data-c="bultoall">${S.cgbAll?'Ver menos':'Ver todos ('+a.length+')'}</button>`:''}`:'')+(L.length===1?'<button type="button" class="link" data-c="lavnew">＋ Otra lavada</button>':'')+((a.length||L.length>1)?`<button type="button" class="link dngl2" data-c="bultoclear">${L.length>1?'Quitar esta lavada':'Borrar todos'}</button>`:'');
 const cl=$('cl');
 if(cl){if(a.length){cl.value=sum>0?String(sum).replace('.',','):'';cl.readOnly=true;cl.dataset.bultos='1'}else{if(cl.dataset.bultos==='1')cl.value='';cl.readOnly=false;cl.dataset.bultos=''}cogLive()}
}
function bultosAgregar(){
 const inp=$('cgbIn');if(!inp)return;const v=pnum(inp.value);
 if(!(v>0))return toast('Escriba el peso del bulto en kilos',true);
 if(v>150&&!confirm('¿Seguro que el bulto pesa '+num(v)+' kg?'))return;
 bultosArr().push(v);save(true);inp.value='';bultosPintar();inp.focus();
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-c="bultoadd"],[data-c="bultodel"],[data-c="bultoundo"],[data-c="bultoall"],[data-c="bultoclear"],[data-c="lavsel"],[data-c="lavnew"]');if(!el||!$('cgBultos'))return;
 const L=bultosLav(),c=el.dataset.c,a=L[bultosSel(L)];
 if(c==='bultoadd'){bultosAgregar();return}
 if(c==='bultodel'){const i=Number(el.dataset.i);if(a[i]!=null&&confirm('¿Quitar el bulto de '+num(a[i])+' kg?')){a.splice(i,1);save(true);bultosPintar()}return}
 if(c==='bultoundo'){a.pop();save(true);bultosPintar();return}
 if(c==='bultoall'){S.cgbAll=!S.cgbAll;bultosPintar();return}
 if(c==='lavsel'){S.cgbSel=Number(el.dataset.i);S.cgbAll=false;bultosPintar();const i=$('cgbIn');if(i)i.focus();return}
 if(c==='lavnew'){const last=L[L.length-1];if(last.length){L.push([])}S.cgbSel=L.length-1;S.cgbAll=false;save(true);bultosPintar();const i=$('cgbIn');if(i)i.focus();return}
 if(c==='bultoclear'){
  if(L.length>1){{const si=bultosSel(L);if(confirm('¿Quitar la lavada '+(si+1)+(a.length?' y sus '+a.length+' bultos':'')+'?')){L.splice(si,1);S.cgbSel=Math.max(0,si-1);save(true);bultosPintar()}}}
  else if(confirm('¿Borrar los '+a.length+' bultos anotados?')){a.length=0;save(true);bultosPintar()}
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cgbIn'){e.preventDefault();bultosAgregar()}});




/* ===== ¿Qué se hace con el café lavado? Secarlo o venderlo mojado ===== */
function cgDestHTML(){const m=S.cgDest==='m';return `<div class="cgdest"><span>¿Qué va a hacer con este café?</span><div class="pchips"><button type="button" class="pchip ${m?'':'on'}" data-c="cgdest" data-v="s">Secarlo</button><button type="button" class="pchip ${m?'on':''}" data-c="cgdest" data-v="m">Venderlo mojado</button></div></div>`}
function destLinea(x){return x&&x.dest==='m'?`<div class="cgdl">Para vender mojado · <button type="button" class="link" data-c="cogventa" data-id="${x.id}">＋ Anotar la venta</button></div>`:''}
document.addEventListener('click',e=>{
 const d=e.target.closest('[data-c="cgdest"]');
 if(d&&$('cgDest')){S.cgDest=d.dataset.v==='m'?'m':'s';$('cgDest').innerHTML=cgDestHTML();cogLive();return}
 const v=e.target.closest('[data-c="cogventa"]');if(!v)return;
 const x=CFd().cog.find(y=>y&&String(y.id)===v.dataset.id);if(!x)return;
 const o={tab:S.tab,sub:S.sub,pid:S.pid},n=new Date();
 S.rtab='mes';S.im={y:n.getFullYear(),m:n.getMonth()};S.mk='venta';S.mc='Café mojado';S.mkg=x.l;S.md=todayStr();
 go('rep');S.from=o;
 setTimeout(()=>{const f=document.querySelector('.mform');f&&f.scrollIntoView({behavior:'smooth',block:'start'})},80);
});


/* cosechadores que le deben hoy (para las cuentas del mes actual) */
function debenHoy(){const k=isoKey(new Date());let n=0,t=0;try{db.people.forEach(p=>{const d=deudaSemana(p.id,k)+deudaPrevia(p.id,k);if(d>0){n++;t+=d}})}catch(e){}return {n,t}}


/* ===== Resumen por WhatsApp: con los adelantos ===== */
function waFila(x){
 const c=x.c,n=adelOf(W(),x.p.id).filter(a=>Number(a.v)>0).length;
 let t=x.p.name+': '+num(c.kg)+' kg';
 if(c.desc>0)t+=' · valor '+fmt(c.gross)+' − adelantos '+fmt(c.desc)+(n>1?' ('+n+')':'');
 return t+' → '+(c.net<0?'DEBE '+fmt(-c.net):fmt(c.net)+(c.paid?' ✓':''));
}
function waAdelTxt(){
 let s='';const t=totals();
 if(t.desc>0)s+='\n*Adelantos descontados: '+fmt(t.desc)+'*';
 try{const d=deudores(),tot=d.reduce((a,x)=>a+x.sem+x.prev,0);if(tot>0)s+='\n*Deben a la finca: '+fmt(tot)+' ('+d.length+(d.length===1?' persona':' personas')+')*'}catch(e){}
 return s;
}

render();
