<title>OALE - Control de Cosecha de Café</title>
<style>
:root{--g1:#087a52;--g2:#0fa04a;--g3:#d9f7e2;--bg:#ffe9b8;--ink:#1d2b21;--muted:#6b7a6e;--line:#f0e3c4;--warn:#e11d48;--card:#fff;--gold:#ffc629;--shadow:0 8px 20px rgba(10,107,52,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff8e6;position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(0,0,0,.06)}
#hdr{background:linear-gradient(135deg,#087a52,#12b356);border-bottom:4px solid var(--gold);color:#fff;position:sticky;top:0;z-index:10;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;min-height:56px;padding:env(safe-area-inset-top) 6px 0}
#hdr h1{margin:0;font-size:18px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hdr.home h1{letter-spacing:.5px;font-size:20px}
.ib{background:none;border:0;color:#fff;width:44px;height:44px;font-size:24px;display:grid;place-items:center;cursor:pointer;border-radius:12px}
.ib:active{background:#ffffff22}
.dotc{width:9px;height:9px;border-radius:50%;background:#7be08f;display:inline-block}
.dotc.off{background:#ffb4a3}
#view{padding:14px}
h2.t{font-size:15px;margin:18px 0 10px;color:var(--ink)}
.hello{font-size:23px;font-weight:850;margin:2px 0;color:#087a52}
.sub{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:linear-gradient(135deg,#0a8f42,#19c463);color:#fff;box-shadow:var(--shadow);border-radius:14px;padding:13px 14px;min-width:0}
.tile span{font-size:12px;opacity:.9;display:block}
.tile b{display:block;font-size:24px;margin-top:4px;letter-spacing:-.5px;overflow-wrap:anywhere}
.tile.dark{background:linear-gradient(135deg,#5a2e16,#a0561f)}
.tile.warn{background:linear-gradient(135deg,#e11d48,#ff5a4f);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.wk{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:6px}
.wk div{text-align:center;line-height:1.25}.wk b{display:block;font-size:15px;color:var(--g1)}.wk span{font-size:12px;color:var(--muted)}
.wb{border:0;background:var(--gold);color:#5a2e16;font-weight:800;border-radius:10px;height:42px;font-size:22px;cursor:pointer}
.link{background:none;border:0;color:var(--g2);font-weight:700;font-size:13px;padding:6px 2px;cursor:pointer}
.bars{display:flex;align-items:flex-end;gap:7px;height:158px;padding-top:4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.bar em{font-style:normal;font-size:10px;color:var(--muted);height:14px;line-height:14px;white-space:nowrap}
.bar i{display:block;width:100%;max-width:34px;background:linear-gradient(#ffd23f,#ff8a00);border-radius:6px 6px 2px 2px}
.bar b{font-size:11px;color:var(--muted);font-weight:600;margin-top:6px;height:16px}
.menu{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:700;color:var(--ink);margin-top:10px;cursor:pointer;text-align:left}
.menu .ic{width:30px;height:30px;border-radius:9px;background:var(--gold);color:#5a2e16;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.menu small{display:block;font-weight:500;color:var(--muted);font-size:12px}
label.l{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}

.btn{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#0a8f42,#19c463);box-shadow:0 5px 14px rgba(10,143,66,.35);color:#fff;padding:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:16px;touch-action:manipulation}
.btn:active{filter:brightness(.92)}
.btn.sec{background:#fff;color:var(--g1);border:2px solid #19c463;box-shadow:none}

.btn.sm{padding:10px;font-size:14px;margin-top:8px}
.est{background:#fff1b8;border:2px solid var(--gold);border-radius:14px;padding:14px;margin-top:16px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.item:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}

.item .nm{flex:1;min-width:0}.item .nm b{display:block;font-size:15px;overflow-wrap:anywhere}.item .nm small{color:var(--muted);font-size:12px}
.item .chev{color:#9fb0a2;font-size:20px}
.amount{font-weight:800;color:var(--g1);white-space:nowrap}
.chip{border:0;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer;background:#fff0eb;color:var(--warn);white-space:nowrap}

.search{position:relative}
.big-g{background:linear-gradient(135deg,#087a52,#12b356);box-shadow:var(--shadow);color:#fff;border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.big-g span{font-size:12px;opacity:.9}.big-g b{display:block;font-size:24px;margin-top:3px;color:#ffe27a}
.big-g.one{grid-template-columns:1fr}
.big-g .s{font-size:13px;margin-top:6px;opacity:.95}
.hero{display:flex;align-items:center;gap:12px}.hero h2{margin:0;font-size:19px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;color:#5a2e16;padding:8px 6px;background:#fff1b8}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.tbl th:not(:first-child),.tbl td:not(:first-child){text-align:right}
.tbl tr.tot td{font-weight:800;background:#d9f7e2;border-bottom:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#ffe9a8;border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:10px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,#0a8f42,#19c463);color:#fff}
.hb{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.hb .tr{background:#e8f0e8;border-radius:6px;height:14px;overflow:hidden}.hb .tr i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8a00);border-radius:6px}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv b{color:var(--g1)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.alert{border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.4;margin:10px 0;background:#fff5d9;border:1px solid #f0dc9b;color:#6b5412}
.alert.red{background:#fff0eb;border-color:#f2d1c7;color:var(--warn)}
.alert.green{background:#edf7e8;border-color:#cfe6c4;color:#245d35}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-top:3px solid var(--gold);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:12}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#8a998d;padding:6px 2px;cursor:pointer;font-weight:600}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:#0a8f42}#nav button.on svg{stroke-width:2.6}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#087a52;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--warn)}
#splash{position:fixed;inset:0;background:linear-gradient(160deg,#087a52,#19c463 70%,#ffc629);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s}
#splash .lg{font-size:60px}#splash h1{margin:6px 0 4px;font-size:46px;letter-spacing:2px}#splash p{margin:0;opacity:.9}
.printonly{display:none}
.plist{display:none}
.farmbar{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:linear-gradient(135deg,#fff1b8,#ffe08a);border:2px solid var(--gold);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-size:14px;color:#5a2e16;cursor:pointer;text-align:left}
.dcard{padding:10px 0;border-bottom:1px solid var(--line)}.dcard:last-child{border-bottom:0}
.dhead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.dhead b{flex:1;font-size:15px;color:var(--g1)}.dhead small{font-weight:500;color:var(--muted);font-size:11px;margin-left:6px}
.dtot{font-weight:800;font-size:13px;color:#5a2e16;background:#fff1b8;border-radius:99px;padding:3px 9px}.dhead .m{font-weight:700;font-size:12px;color:var(--muted);min-width:70px;text-align:right}

.pesa input.f{padding:11px 8px;text-align:center;border-radius:10px}
.px{border:0;background:#ffe3e9;color:var(--warn);border-radius:10px;height:44px;font-size:16px;font-weight:800;cursor:pointer}
.btn.addp{margin-top:4px;padding:9px}
.farm.act{border:2px solid #19c463}
.plist h2{margin:0 0 4px;font-size:22px;color:#145c2c}
.plist .sub{margin-bottom:14px;font-size:14px}
.plist table{width:100%;border-collapse:collapse;font-size:16px}
.plist th{text-align:left;border-bottom:2px solid #145c2c;padding:8px 6px;font-size:13px;text-transform:uppercase}
.plist td{padding:10px 6px;border-bottom:1px solid #ccd6cc}
.plist th:last-child,.plist td:last-child{text-align:right}
.plist tr.tot td{font-weight:800;font-size:18px;border-top:2px solid #145c2c;border-bottom:0}
@media print{
 body.pl #app{display:none!important}
 body.pl .plist{display:block}
 body{background:#fff}#app{box-shadow:none;max-width:none;padding:0}
 #hdr,#nav,.toast,.noprint,#splash{display:none!important}

}

/* ===== Mi café ===== */
#nav{grid-template-columns:repeat(5,1fr)}#nav button{font-size:10.5px;letter-spacing:0}

.cafe{font-size:18px}.cafe label.l{font-size:15px}

.bigbtn{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:14px;margin-top:12px;text-align:left;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}

.bigbtn .e{font-size:36px;width:64px;height:64px;flex-shrink:0;border-radius:18px;background:#fff4d1;border:1.5px solid #f2b134;display:grid;place-items:center}

.res.bad{background:#c8312b}.res.warn{background:#b5701a}.res.ok{background:#0a8a5c}
.res span{display:block;font-size:13px;letter-spacing:.09em;text-transform:uppercase;opacity:.9}
.res b{display:block;font-family:var(--serif);font-weight:500;font-size:52px;line-height:1.1;color:#ffe27a}
.cfline{font-size:18px;line-height:1.45;margin:10px 0}.cfline b{color:#0a8a5c}
.cfmsg{border-radius:18px;padding:14px;margin:12px 0;font-size:17px;line-height:1.45;border:1.5px solid}
.cfmsg.ok{background:#dff2e6;border-color:#8fcfa8;color:#055f40}
.cfmsg.warn{background:#fff4d1;border-color:#f2b134;color:#5a3a00}
.cfmsg.bad{background:#fbe4e2;border-color:#e08a85;color:#8a1d18}
.cfhint{border:2px dashed #c6d8c1;border-radius:18px;padding:16px;margin:12px 0;color:var(--muted);font-size:17px;text-align:center}
.cfcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 16px 10px;margin-top:12px;box-shadow:var(--shadow)}
.cfcard b{display:block;font-size:20px;font-family:var(--serif);color:#0a8a5c;margin-top:8px}.cfcard p{font-size:17px;line-height:1.45;margin:6px 0}
.cgrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cgrow:last-child{border-bottom:0}.cgrow b{font-size:17px}.cgrow small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.cgr{font-family:var(--serif);font-size:22px;color:#0a8a5c;font-weight:600;white-space:nowrap}
.pchip.sm{padding:8px 11px;font-size:14px}.pchip:disabled{opacity:.9}
.lunahead{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;margin:14px 0 8px;text-align:center}

.lgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.lc{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;min-height:54px;padding:2px 0;line-height:1.05}
.lc i{font-style:normal;font-size:20px}.lc b{font-size:14px}
.lc.g{background:#b9e6c3;color:#055f40}.lc.y{background:#fff0a8;color:#5a3a00}.lc.z{background:#e3e5e3;color:#6b6f6b}
.lc.hoy{outline:3px solid #0a8a5c;outline-offset:-1px}
.lleg{display:grid;gap:6px;margin:12px 0;font-size:15px}.lleg span{display:flex;align-items:center;gap:8px}
.lleg .lc{min-height:0;width:22px;height:22px;border-radius:6px;flex-shrink:0}

/* foto de la finca */
body.hasfoto .hbanner{background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.14)),var(--finca) center/cover;height:176px}
.fotorow{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 6px}
.fbtn{border:1.5px solid #0a8a5c;background:#fff;color:#0a8a5c;border-radius:99px;padding:10px 16px;font-weight:600;font-size:15px;cursor:pointer;touch-action:manipulation}
.fbtn.q{border-color:#c8312b;color:#c8312b}

/* registrar cosecha */
.dayhead b{display:block;font-family:var(--serif);font-size:27px;font-weight:500;color:#0a8a5c;margin:6px 0 10px}
.daybar{display:grid;grid-template-columns:34px 1fr 34px;gap:4px;align-items:center}
.daybar>button{border:0;background:#f2b134;border-radius:12px;height:58px;font-size:20px;font-weight:700;color:#3a2a00;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600;cursor:pointer}
.days button b{font-size:19px;color:var(--ink)}
.days button.on{background:#0a8a5c;border-color:#0a8a5c;color:#e8f4ea}.days button.on b{color:#fff}
.days button.hoy::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#f2b134}
.otra{position:relative;display:inline-flex;margin:10px 0 2px;padding:10px 16px;border:1.5px dashed #0a8a5c;border-radius:99px;color:#0a8a5c;font-weight:600;font-size:15px;overflow:hidden}
.otra input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pcard{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;margin-top:8px;text-align:left;cursor:pointer;color:var(--ink)}
.pcard .nm b{display:block;font-size:19px}.pcard small{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.pcard .ck{margin-left:auto;font-style:normal;width:30px;height:30px;border-radius:50%;background:#e8efe6;color:transparent;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.pcard.on{border-color:#0a8a5c;background:#e7f4ea;box-shadow:0 0 0 2px rgba(10,138,92,.18)}.pcard.on .ck{background:#0a8a5c;color:#fff}

#pSearch[hidden]{display:none}
#pCards .ck{display:none}
.pcard.sel{cursor:default;margin-top:0}
.pcard .chip{margin-left:auto;background:#fff;border:1.5px solid #0a8a5c;color:#0a8a5c;padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer}
#rQ{font-size:19px;padding:15px 16px}

/* jornales y retoques de Mi café */
#view.incafe::before{display:none}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;text-align:center}
.stepper button{height:58px;border:0;border-radius:16px;background:#f2b134;color:#3a2a00;font-size:30px;font-weight:700;cursor:pointer}
.stepper b{font-family:var(--serif);font-size:28px;color:#0a8a5c;font-weight:500}
.lotbox{border-top:1px solid var(--line);padding-top:4px;margin-top:6px}.lotbox:first-of-type{border-top:0;margin-top:0}
.lotbox .cfmsg{margin:4px 0 10px;font-size:16px}
.jrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;font-size:15px}.jrow b{font-size:15px;color:#0a8a5c}
.cvt td:last-child{font-weight:700;color:#0a8a5c;text-align:right;white-space:nowrap}.cvt th:last-child{text-align:right}

.asist{border:1.5px solid #0a8a5c;margin-bottom:6px}
.bigopt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #c6d8c1;border-radius:16px;padding:14px;margin-top:8px;font-size:17px;font-weight:600;color:#1b2a22;cursor:pointer;line-height:1.35}
.bigopt:active{background:#e7f4ea}.bigopt.q{color:#5f6b62;border-style:dashed;font-weight:500}

#hdr,#hdr.home{background:radial-gradient(120% 90% at 50% 0,#1ac484 0,rgba(26,196,132,0) 70%),#0a8a5c}
.btn{background:linear-gradient(180deg,#18bd80,#0a8a5c)}
.tile,.big-g{background:linear-gradient(135deg,#0a8a5c,#1ac27f)}.tile:nth-child(2){background:linear-gradient(135deg,#0d9a66,#25cf8c)}
.tile.dark{background:#066a48}.tile.warn{background:#c8312b}
.res{background:linear-gradient(135deg,#0a8a5c,#1ac27f)}.res.bad{background:#c8312b}.res.warn{background:#b5701a}

#reg{position:fixed;inset:0;z-index:55;background:radial-gradient(120% 70% at 50% 0,#1ac484 0,rgba(26,196,132,0) 70%),#0a8a5c;overflow:auto;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 18px) 18px 40px}
#reg[hidden]{display:none}
.regbox{width:100%;max-width:480px;text-align:center;color:#fff}
.regmk{width:150px;height:126px;margin:0 auto 4px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}.regmk svg{width:100%;height:100%}
.regbox h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:6px 0}
.regbox p{margin:0 0 6px;font-size:17px;line-height:1.4}
.regbox label{display:block;text-align:left;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin:16px 0 6px;color:#d9f5e8}
.regbox input:not([type=checkbox]){width:100%;font-size:20px;padding:15px;border-radius:16px;border:0;background:#fff;color:#1b2a22}
.regbox label.rgchk{display:flex;gap:10px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;line-height:1.4;color:#fff;text-align:left}
.rgchk input{width:26px;height:26px;flex:none;margin-top:1px}
.regbox .btn{margin-top:20px;background:#f2b134;color:#3a2a00;box-shadow:0 3px 0 #a87414}
.regbox .btn.sec{background:transparent;color:#fff;border:2px solid #fff;box-shadow:none}

.regold{margin-top:26px;padding-top:6px;border-top:1px solid rgba(255,255,255,.35)}
.regold p{font-size:16px;margin:12px 0 0}
.regbox label.btn.rgfile{display:block;text-transform:none;letter-spacing:0;font-size:17px;font-weight:700;text-align:center;cursor:pointer;margin-top:10px;padding:15px;color:#fff}
.pinin{text-align:center;letter-spacing:.5em;font-size:34px!important;padding:12px!important}
.regbox input.pinin::placeholder{letter-spacing:.4em}

.precio{background:linear-gradient(135deg,#0a8a5c,#1ac27f);color:#fff;border-radius:22px;padding:16px;margin-top:10px;box-shadow:var(--shadow);border-top:3px solid #f2b134}
.prh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.prh b{font-family:var(--serif);font-size:21px;font-weight:600}.prh span{font-size:12px;opacity:.92}
.prv{font-family:var(--serif);font-size:46px;line-height:1.1;color:#ffe27a;margin-top:6px}
.prs{font-size:15px;opacity:.96}.prk{margin-top:6px;font-size:15px;font-weight:600}
.prw{margin-top:10px;background:#fff4d1;color:#5a3a00;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
.prb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.precio .fbtn{background:#fff;text-decoration:none;display:inline-block}
.precio .note{color:#e7fff3;margin:8px 0 0;font-size:13px}

/* ===== Inicio: nombre arriba de la foto, botones sobre la imagen y letras cómodas para la vista ===== */
#hdr.home+#view::before{display:none}
.hbanner{display:block;position:relative;height:150px;margin:6px 0 10px;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;border:0}
body.hasfoto .hbanner{height:176px}
.hbanner .bcam,.hbanner .bx{position:absolute;top:10px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.32);display:grid;place-items:center;cursor:pointer;padding:0;touch-action:manipulation}
.hbanner .bx{right:10px;font-size:19px;font-weight:700;color:#a32a22;line-height:1}
.hbanner .bcam{right:60px}.hbanner .bcam svg{width:22px;height:22px}
.fhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 2px}
.fhead b{font-family:var(--serif);font-size:25px;font-weight:600;color:#066a48;line-height:1.15}
.fhead .flink{border:0;background:none;color:#066a48;font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer;padding:6px 2px}
/* letras: oscuras y suaves (no negro puro), verdes más hondos y fondos sin brillo fuerte */
:root{--ink:#22302a;--muted:#52615a}
body{color:#22302a}
.hello,h2.t,.wk b,.amount,.est b,.link,.hero h2,.cgr,.pbar b,.lunahead b,.bigbtn b,.stepper b,.dayhead b,.cfline b,.pf b,.cfcard b,.fbtn,.fbtn svg,.regbox h2{color:#066a48}
.sub,.note,label.l{color:#52615a}
.card,.wk,.menu,.farmbar,.cfcard,.bigbtn,.pcard,.days button,input.f,select.f{background:#fbfcf9}
.btn{background:linear-gradient(180deg,#0a8a5c,#067a52);color:#f6fff9}
.btn.sec{background:#fbfcf9;color:#066a48}
.tile,.big-g,.precio,.res{background:linear-gradient(135deg,#066a48,#09885c)}
.tile:nth-child(2){background:linear-gradient(135deg,#07784f,#0a8f61)}
.tile.dark{background:#055a3d}.tile.warn{background:#b32a24}
.res.bad{background:#b32a24}.res.warn{background:#9a5f12}
.tile span,.big-g span,.precio .prs,.prh span{color:#effcf5;opacity:1}
.tile b,.big-g b,.prv,.res b{color:#ffe9a0}
.precio .note{color:#effcf5}
#hdr,#hdr.home{background:radial-gradient(120% 90% at 50% 0,#17a574 0,rgba(23,165,116,0) 70%),#08805a}
#nav button{color:#4a5851}#nav button.on{color:#066a48}
</style>

/* ===== almacenamiento ===== */
function openOfflineDB(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error('sin IndexedDB'));return}const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbRead(){const d=await openOfflineDB();return new Promise((res,rej)=>{const q=d.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(KEY);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function idbWrite(v){const d=await openOfflineDB();return new Promise((res,rej)=>{const t=d.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).put(v,KEY);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)})}
function blank(){return {farms:[{id:1,name:'',people:[],weeks:{}}],cur:1,meta:{}}}
function normFarm(f){
 f.name=String(f.name||'');
 f.people=Array.isArray(f.people)?f.people:[];
 f.weeks=f.weeks&&typeof f.weeks==='object'?f.weeks:{};
 Object.values(f.weeks).forEach(w=>{
  if(w.price==null)w.price='';
  if(!w.entries||typeof w.entries!=='object')w.entries={};
  if(!w.extra||typeof w.extra!=='object')w.extra={};
  Object.keys(w.entries).forEach(k=>{const a=Array.isArray(w.entries[k])?w.entries[k]:[];while(a.length<7)a.push('');w.entries[k]=a.slice(0,7)});
  if(!w.pesas||typeof w.pesas!=='object')w.pesas={};
  Object.keys(w.entries).forEach(k=>{const P=w.pesas[k]=Array.isArray(w.pesas[k])?w.pesas[k]:[];for(let i=0;i<7;i++){const arr=Array.isArray(P[i])?P[i]:(P[i]=[]);const e=w.entries[k][i];if(!arr.length&&e!==''&&e!=null)arr.push({k:String(e),h:''})}});
 });
}
function normalize(d){
 if(!d||typeof d!=='object')return blank();
 if(!Array.isArray(d.farms)){
  /* formato anterior (una sola finca): se convierte */
  const m=d.meta&&typeof d.meta==='object'?d.meta:{};
  d={farms:[{id:1,name:String(m.farm||''),people:d.people,weeks:d.weeks}],cur:1,meta:m};
 }
 d.farms=d.farms.filter(f=>f&&typeof f==='object');
 if(!d.farms.length)d.farms.push({id:1,name:'',people:[],weeks:{}});
 d.farms.forEach((f,i)=>{if(!Number(f.id))f.id=i+1;f.id=Number(f.id);normFarm(f)});
 d.meta=d.meta&&typeof d.meta==='object'?d.meta:{};
 if(!d.farms.some(f=>f.id===Number(d.cur)))d.cur=d.farms[0].id;
 d.cur=Number(d.cur);
 return d;
}
let root;try{root=normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){root=blank()}
const F=()=>root.farms.find(f=>f.id===root.cur)||root.farms[0];
const farmName=()=>F().name||'Mi finca';
/* "db" = la finca activa (cosechadores y semanas) + datos generales */
const db={get people(){return F().people},set people(v){F().people=v},get weeks(){return F().weeks},set weeks(v){F().weeks=v},get meta(){return root.meta}};
function withFarm(f,fn){const old=root.cur;root.cur=f.id;try{return fn()}finally{root.cur=old}}

function save(quiet){
 let ok=false;
 try{localStorage.setItem(KEY,JSON.stringify(root));ok=true}catch(e){}

 return ok;
}

/* ===== semanas ISO ===== */
function isoKey(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const y=d.getUTCFullYear(),ys=new Date(Date.UTC(y,0,1));return y+'-W'+String(Math.ceil(((d-ys)/864e5+1)/7)).padStart(2,'0')}
function mondayOf(key){const [y,w]=key.split('-W').map(Number);const j4=new Date(Date.UTC(y,0,4)),dow=j4.getUTCDay()||7;const m=new Date(j4);m.setUTCDate(j4.getUTCDate()-(dow-1)+(w-1)*7);return m}
function shiftKey(key,n){const m=mondayOf(key);m.setUTCDate(m.getUTCDate()+7*n);return isoKey(new Date(m.getUTCFullYear(),m.getUTCMonth(),m.getUTCDate()))}
function dayDate(key,i){const m=mondayOf(key);m.setUTCDate(m.getUTCDate()+i);return m}
function shortDate(d){return d.toLocaleDateString('es-CO',{day:'numeric',month:'short',timeZone:'UTC'}).replace('.','')}
function wkNum(k){return Number(k.split('-W')[1])}
function rangeText(k){const a=dayDate(k,0),b=dayDate(k,6);return shortDate(a)+' – '+shortDate(b)+' '+b.getUTCFullYear()}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let cur=isoKey(new Date());

const EMPTY={price:'',entries:{},extra:{}};
const W=(k=cur)=>db.weeks[k]||EMPTY;
function prevPrice(k=cur){const ks=Object.keys(db.weeks).filter(x=>x<k&&Number(db.weeks[x].price)>0).sort();return ks.length?Number(db.weeks[ks[ks.length-1]].price):0}
function priceFor(k=cur){const p=Number(W(k).price);return p>0?p:prevPrice(k)}
/* al escribir en una semana nueva se "congela" el precio heredado para que cambios futuros no alteren cuentas pasadas */
function ensure(k=cur){if(!db.weeks[k]){const pp=prevPrice(k);db.weeks[k]={price:pp?String(pp):'',entries:{},extra:{},pesas:{}}}return db.weeks[k]}
const person=id=>db.people.find(p=>p.id===Number(id));
/* "Eliminar" = retirar: el cosechador sale de las listas activas pero sus semanas anteriores se conservan */
const activePeople=()=>db.people.filter(p=>!p.archived);
const wkPeople=(k=cur)=>db.people.filter(p=>{if(!p.archived)return true;const c=calc(p.id,k);return c.kg>0||c.desc>0||c.jorn>0||c.paid});
const inWeek=(k=cur)=>wkPeople(k).filter(p=>{const c=calc(p.id,k);return c.kg>0||c.desc>0||c.jorn>0});
const pn=p=>esc(p.name)+(p.archived?' <small style="color:#7d7360">(retirado)</small>':'');
/* varias pesas por día: cada pesa es {k:kilos, h:hora}. "entries" guarda el total del día (lo usan cuentas, reportes y Excel) */
function pesasOf(w,pid,i){return (w.pesas&&w.pesas[pid]&&w.pesas[pid][i])||[]}
function pesasArr(w,pid,i){const P=(w.pesas||(w.pesas={}));const a=P[pid]||(P[pid]=Array.from({length:7},()=>[]));return a[i]||(a[i]=[])}
function syncDay(w,pid,i){const arr=pesasOf(w,pid,i),sum=arr.reduce((x,q)=>x+(Number(q.k)||0),0),has=arr.some(q=>q.k!==''&&q.k!=null);const e=w.entries[pid]||(w.entries[pid]=Array(7).fill(''));e[i]=has?String(Math.round(sum*100)/100):''}
function addPesa(w,pid,i,k,h){const arr=pesasArr(w,pid,i);arr.push({k:String(k),h:h||''});syncDay(w,pid,i);return arr.length-1}
function setPesa(w,pid,i,j,k){const arr=pesasArr(w,pid,i);if(arr[j]){arr[j].k=k;syncDay(w,pid,i)}}
function delPesa(w,pid,i,j){pesasArr(w,pid,i).splice(j,1);syncDay(w,pid,i)}
function nowHM(){return new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false})}
function calc(id,k=cur){const w=W(k),ent=w.entries[id]||[],kg=ent.reduce((a,v)=>a+(Number(v)||0),0),gross=kg*priceFor(k),ex=w.extra[id]||{},desc=Number(ex.desc)||0;const jorn=jornOf(id,k);return {kg,gross,desc,jorn,net:gross-desc+jorn,paid:!!ex.paid}}
function totals(k=cur){const t={kg:0,gross:0,desc:0,jorn:0,net:0,pending:0,paid:0,cos:0,cosPend:0};wkPeople(k).forEach(p=>{const c=calc(p.id,k);t.kg+=c.kg;t.gross+=c.gross;t.desc+=c.desc;t.jorn+=c.jorn;t.net+=c.net;const cn=c.net-c.jorn;t.cos+=cn;if(c.paid)t.paid+=c.net;else{if(c.net>0)t.pending+=c.net;if(cn>0)t.cosPend+=cn}});return t}
function dayKg(k=cur){const a=Array(7).fill(0);wkPeople(k).forEach(p=>(W(k).entries[p.id]||[]).forEach((v,i)=>a[i]+=Number(v)||0));return a}
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
const num=n=>(Number(n)||0).toLocaleString('es-CO',{maximumFractionDigits:2});

function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const stamp=()=>new Date().toISOString().slice(0,10);
function markBackup(){db.meta.lastBackup=new Date().toISOString();save(true);toast('Respaldo listo ✓ Guárdalo en un lugar seguro');if(!S.sub||S.sub==='settings')render(true)}
const backupBlob=()=>new Blob([JSON.stringify(root,null,2)],{type:'application/json'});
function backupDownload(){download(backupBlob(),'respaldo-oale-'+stamp()+'.json');markBackup()}
let canShareFiles=false;
try{const f=new File([''],'t.json',{type:'application/json'});canShareFiles=!!(navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){}
async function shareBackup(){try{const f=new File([backupBlob()],'respaldo-oale-'+stamp()+'.json',{type:'application/json'});await navigator.share({files:[f],title:'Respaldo OALE'});markBackup()}catch(e){if(e&&e.name!=='AbortError')backupDownload()}}
const cell=v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const n2=n=>String(Math.round((Number(n)||0)*100)/100).replace('.',',');
function csv(keys){
 const rows=[['Finca','Semana','Desde','Persona',...DAYS,'Total kg','Precio por kg','Valor','Descuento','A pagar','Pagado']];
 keys.forEach(k=>{const w=W(k),pr=priceFor(k),desde=dayDate(k,0).toISOString().slice(0,10);
  wkPeople(k).forEach(p=>{const ent=w.entries[p.id]||[],c=calc(p.id,k);if(!c.kg&&!c.desc&&!ent.some(v=>v!==''&&v!=null))return;rows.push([farmName(),k,desde,p.name,...DAYS.map((d,i)=>n2(ent[i])),n2(c.kg),n2(pr),n2(c.gross),n2(c.desc),n2(c.net),c.paid?'Sí':'No'])})});
 return '\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n');
}

 document.body.classList.add('pl');

 window.addEventListener('afterprint',done,{once:true});

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a;
 switch(a){
  case 'goto':go(el.dataset.tab||S.tab,el.dataset.sub||null,el.dataset.pid?Number(el.dataset.pid):null);if(el.dataset.tab==='people'&&!el.dataset.sub)S.q='';break;
  case 'back':if(S.tab==='cafe'&&S.sub)go('cafe');else if(S.tab==='cafe')go('home');else if(S.sub==='detail'||S.sub==='addperson')go('people');else go('home');break;
  case 'prev':cur=shiftKey(cur,-1);render(true);break;
  case 'next':cur=shiftKey(cur,1);render(true);break;
  case 'today':cur=isoKey(new Date());render(true);break;
  case 'pickweek':cur=el.dataset.k;render();break;
  case 'rtab':S.rtab=el.dataset.v;render(true);break;
  case 'dosave':doRegister();break;
  case 'addsubmit':addPerson();break;
  case 'togglepaid':{const id=Number(el.dataset.pid),w=ensure(),ex=w.extra[id]||(w.extra[id]={});ex.paid=!ex.paid;save();render(true);break}
  case 'del':{const p=person(el.dataset.pid);if(p&&confirm('¿Retirar a '+p.name+'? Ya no saldrá en la lista para registrar cosechas, pero su historial de las semanas se conserva.')){p.archived=true;p.archivedAt=todayStr();save();go('people');toast(p.name+' fue retirado. Su historial sigue guardado.')}break}
  case 'rename':{const p=person(S.pid);if(!p)break;const n=prompt('Nombre del cosechador',p.name);if(n&&n.trim()){const nn=n.trim();if(activePeople().some(x=>x.id!==p.id&&x.name.toLowerCase()===nn.toLowerCase())){toast('Ese nombre ya existe',true);break}p.name=nn;save();render(true)}break}
  case 'farmsel':{root.cur=Number(el.dataset.fid);save(true);S.q='';S.rp=null;go('home');toast('Finca: '+farmName());break}
  case 'farmadd':addFarm();break;
  case 'farmren':{const f=root.farms.find(x=>x.id===Number(el.dataset.fid));if(!f)break;const n=prompt('Nombre de la finca',f.name);if(n&&n.trim()){const nn=n.trim();if(root.farms.some(x=>x.id!==f.id&&x.name.trim().toLowerCase()===nn.toLowerCase())){toast('Ya tienes una finca con ese nombre',true);break}f.name=nn;save();render(true)}break}
  case 'farmdel':{const f=root.farms.find(x=>x.id===Number(el.dataset.fid));if(!f)break;if(root.farms.length<2){toast('Debes tener al menos una finca',true);break}if(confirm('¿Eliminar la finca "'+(f.name||'Mi finca')+'" con sus '+f.people.length+' cosechadores y TODOS sus registros? No se puede deshacer.')){root.farms=root.farms.filter(x=>x.id!==f.id);if(root.cur===f.id)root.cur=root.farms[0].id;save();render(true)}break}
  case 'addpesa':{const pid=Number(el.dataset.pid),i=Number(el.dataset.i),w=ensure(),j=addPesa(w,pid,i,'',nowHM());save(true);render(true);const inp=$('p'+pid+'_'+i+'_'+j);if(inp)inp.focus();break}
  case 'delpesa':{const pid=Number(el.dataset.pid),i=Number(el.dataset.i),j=Number(el.dataset.j),w=ensure();const q=pesasOf(w,pid,i)[j];if(q&&Number(q.k)>0&&!confirm('¿Borrar esta pesa de '+num(q.k)+' kg?'))break;delPesa(w,pid,i,j);save();render(true);break}
  case 'backup':backupDownload();break;
  case 'share':shareBackup();break;
  case 'csvw':download(new Blob([csv([cur])],{type:'text/csv;charset=utf-8'}),'oale-'+cur+'.csv');toast('Archivo descargado');break;
  case 'csva':{const ks=Object.keys(db.weeks).sort();if(!ks.length){toast('Aún no hay semanas registradas',true);break}download(new Blob([csv(ks)],{type:'text/csv;charset=utf-8'}),'oale-todas-las-semanas-'+stamp()+'.csv');toast('Archivo descargado');break}
  case 'pickp':{const id=el.dataset.id;S.rp=Number(id);const sel=$('rPerson');if(sel)sel.value=id;document.querySelectorAll('.pcard').forEach(b=>b.classList.toggle('on',b.dataset.id===id));liveNow();const kk=$('rKg');if(kk)kk.focus();break}
  case 'restore':{const p=person(el.dataset.pid);if(p){p.archived=false;delete p.archivedAt;save();render(true);toast(p.name+' volvió a la lista')}break}
  case 'exit':{save(true);S.auth=false;const b=$('bye');b.innerHTML=`<div style="width:110px;height:110px;margin-bottom:14px">${MARK}</div><h2 style="font-family:Georgia,serif;font-weight:500;margin:0 0 8px">Sesión cerrada</h2><p style="margin:0 0 22px;max-width:300px;line-height:1.5;opacity:.9">Tus datos quedaron guardados. Para cerrar OALE del todo, desliza la app hacia arriba desde el borde de abajo de la pantalla.</p><button class="btn" style="background:#e0a93b;color:#2b2a1f;max-width:260px;box-shadow:none" data-a="back2">Volver a entrar</button>`;b.hidden=false;try{window.close()}catch(e){}break}

/* ---------- 3. Abonado según la luna (algoritmo de Jean Meeus) ---------- */
function jdPhase(kk,full){
 const r=Math.PI/180,T=kk/1236.85,s=Math.sin,T2=T*T,T3=T2*T,T4=T3*T;
 const J=2451550.09766+29.530588861*kk+0.00015437*T2-0.00000015*T3+0.00000000073*T4;
 const E=1-0.002516*T-0.0000074*T2,M=(2.5534+29.1053567*kk-0.0000014*T2-0.00000011*T3)*r,
 P=(201.5643+385.81693528*kk+0.0107582*T2+0.00001238*T3-0.000000058*T4)*r,
 F=(160.7108+390.67050284*kk-0.0016118*T2-0.00000227*T3+0.000000011*T4)*r,
 O=(124.7746-1.56375588*kk+0.0020672*T2+0.00000215*T3)*r;
 const c=(full?-0.40614:-0.4072)*s(P)+(full?0.17302:0.17241)*E*s(M)+(full?0.01614:0.01608)*s(2*P)+(full?0.01043:0.01039)*s(2*F)
 +(full?0.00734:0.00739)*E*s(P-M)-(full?0.00515:0.00514)*E*s(P+M)+(full?0.00209:0.00208)*E*E*s(2*M)
 -0.00111*s(P-2*F)-0.00057*s(P+2*F)+0.00056*E*s(2*P+M)-0.00042*s(3*P)+0.00042*E*s(M+2*F)+0.00038*E*s(M-2*F)
 -0.00024*E*s(2*P-M)-0.00017*s(O)-0.00007*s(P+2*M)+0.00004*s(2*P-2*F)+0.00004*s(3*M)+0.00003*s(P+M-2*F)
 +0.00003*s(2*P+2*F)-0.00003*s(P+M+2*F)+0.00003*s(P-M+2*F)-0.00002*s(P-M-2*F)-0.00002*s(3*P+M)+0.00002*s(4*P);
 const A=[[299.77,0.107408,-0.009173,.000325],[251.88,.016321,0,.000165],[251.83,26.651886,0,.000164],[349.42,36.412478,0,.000126],[84.66,18.206239,0,.00011],[141.74,53.303771,0,.000062],[207.14,2.453732,0,.00006],[154.84,7.30686,0,.000056],[34.52,27.261239,0,.000047],[207.19,.121824,0,.000042],[291.34,1.844379,0,.00004],[161.72,24.198154,0,.000037],[239.56,25.513099,0,.000035],[331.55,3.592518,0,.000023]];
 return J+c+A.reduce((a,x)=>a+x[3]*s((x[0]+x[1]*kk+x[2]*T2)*r),0);
}
let EVC=null;
function moonEv(Y){
 if(EVC&&EVC.Y===Y)return EVC.list;
 const list=[],k0=Math.floor((Y-1-2000)*12.3685),k1=Math.ceil((Y+3-2000)*12.3685);
 for(let k=k0;k<=k1;k++){list.push({t:(jdPhase(k,false)-2440587.5)*864e5,n:true});list.push({t:(jdPhase(k+0.5,true)-2440587.5)*864e5,n:false})}
 list.sort((a,b)=>a.t-b.t);EVC={Y,list};return list;
}
const MOONS=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
function dayMoon(y,m,d){
 const ev=moonEv(new Date().getFullYear()),t=Date.UTC(y,m,d,17,0,0);   /* mediodía en Colombia (UTC-5) */
 let i=0;while(i<ev.length-1&&ev[i+1].t<=t)i++;
 let a=i;while(a>0&&!ev[a].n)a--;let b=i+1;while(b<ev.length-1&&!ev[b].n)b++;
 const fr=(t-ev[a].t)/(ev[b].t-ev[a].t);
 return {men:!ev[i].n,icon:MOONS[Math.round(fr*8)%8],ix:Math.round(fr*8)%8};
}

 if(typeof k==='number'){const p=PROBS[k];body=`<div class="cfmsg ok"><b class="pf">${PIC[k]}<span>Puede ser: ${p[0]}</span></b><br><u>Cómo se nota:</u> ${p[1]}<br><u>Qué hacer:</u> ${p[2]}</div><div class="cfmsg warn">Es una orientación, no un diagnóstico. Para estar seguro, consulte al extensionista del Comité de Cafeteros.</div>`}

 else{const n=PA[k];body=`<div class="cfline"><b>${n.q}</b></div>`+n.o.map(o=>`<button type="button" class="bigopt" data-c="pa" data-v="${o[1]}">${PAIC[o[1]]||''}${o[0]}</button>`).join('')+(k!=='start'?'<button type="button" class="bigopt q" data-c="pa" data-v="none">Ninguna se parece</button>':'')}
 return `<div class="card asist"><div class="cfline"><b>${IC.mag} Asistente: ¿qué le pasa a su cafetal?</b></div>${body}${st.length>1?'<div class="pchips" style="margin-top:10px"><button type="button" class="pchip" data-c="paback">← Atrás</button><button type="button" class="pchip" data-c="pareset">Empezar de nuevo</button></div>':''}</div>`;

function abonoAsist(){
 const a=S.ab||(S.ab={}),now=new Date(),mo=now.getMonth(),dm=dayMoon(now.getFullYear(),mo,now.getDate()),mm=CFd().meses[CFd().region];
 const ch=(key,opts)=>`<div class="pchips">${opts.map(o=>`<button type="button" class="pchip ${a[key]===o[0]?'on':''}" data-c="ab" data-k="${key}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`;
 let res='';
 if(a.hum&&a.cal&&a.last){
  const ok=[dm.men,mm.includes(mo+1),a.hum==='si',a.cal!=='si',a.last!=='poco'];
  const L=[[ok[0],ok[0]?'La luna está en menguante.':'La luna está en creciente. Se abona en menguante.'],
   [ok[1],ok[1]?'Estamos en época de abonar en su zona.':(mm.length?'No es época de abonar en su zona: se abona cuando empiezan las lluvias.':'Escoja arriba los meses de abonar de su zona.')],
   [ok[2],ok[2]?'La tierra está húmeda.':'La tierra está seca. Espere a que llueva.'],
   [ok[3],ok[3]?'No echó cal hace poco.':'Echó cal hace menos de 2 meses. La cal y el abono no van juntos: espere.'],
   [ok[4],ok[4]?'Ya pasó el tiempo desde la última abonada.':'Abonó hace menos de 3 meses. Es muy pronto: se abona 2 veces al año.']];
  const all=ok.every(Boolean),nw=nextWindow();
  res=`<div class="cfmsg ${all?'ok':'bad'}"><b>${all?IC.ok+' Sí, hoy es buen día para abonar.':IC.bad+' Hoy es mejor no abonar.'}</b></div>`+L.map(x=>`<p class="cfline">${x[0]?IC.ok:IC.warn} ${x[1]}</p>`).join('')+(!all&&nw?`<p class="cfline">${IC.cal} Próximos días buenos por luna y época: <b>${nw}</b>.</p>`:'')+'<p class="note">Cantidad: 100 a 150 gramos por árbol. Lo exacto depende del análisis de suelo.</p>';
 }
 return `<div class="card asist"><div class="cfline"><b>${IC.sprout} Asistente: ¿puedo abonar hoy?</b></div>
 <p class="cfline">¿La tierra está húmeda?</p>${ch('hum',[['si','Sí, húmeda'],['no','No, está seca']])}
 <p class="note">Meta la mano 5 cm en la tierra: si se le pega, está húmeda.</p>
 <p class="cfline">¿Echó cal en los últimos 2 meses?</p>${ch('cal',[['si','Sí'],['no','No']])}
 <p class="cfline">¿Cuándo fue la última abonada?</p>${ch('last',[['poco','Hace menos de 3 meses'],['ok','Hace 3 meses o más'],['nunca','No he abonado']])}${res}</div>`;
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-c="pa"],[data-c="paback"],[data-c="pareset"],[data-c="ab"]');if(!el)return;const c=el.dataset.c,v=el.dataset.v;
 if(c==='pa'){S.pa=(S.pa||['start']).concat(/^\d+$/.test(v)?Number(v):v)}
 else if(c==='paback'){S.pa=(S.pa||['start']).slice(0,-1);if(!S.pa.length)S.pa=['start']}
 else if(c==='pareset')S.pa=['start'];
 else{(S.ab||(S.ab={}))[el.dataset.k]=v}
 render(true)});

/* ================= REGISTRO DE USUARIO (para saber cuántas personas usan OALE) ================= */
/* Se conecta a un Formulario de Google. Mientras 'url' esté vacío, el registro solo se guarda en el celular. */
const REG={url:'',entries:{id:'',nombre:'',celular:'',municipio:'',fecha:''}};
function regShow(edit){
 const u=db.meta.user||{},r=$('reg');
 r.innerHTML=`<div class="regbox"><div class="regmk">${MARK}</div><h2>${edit?'Mis datos':'Bienvenido a OALE'}</h2><p>${edit?'Puede corregir sus datos.':'Para empezar, cuéntenos quién es usted. Solo toma un minuto.'}</p>
 <label for="rgN">Nombre completo</label><input id="rgN" autocomplete="name" value="${esc(u.nombre||'')}">
 <label for="rgC">Número de celular</label><input id="rgC" type="tel" inputmode="numeric" maxlength="10" value="${esc(u.celular||'')}" placeholder="3001234567">
 <label for="rgM">Municipio y vereda</label><input id="rgM" value="${esc(u.municipio||'')}" placeholder="Ej. Pitalito, vereda La Laguna">
 <label for="rgP1">${u.nombre?'Cambiar clave (déjelo vacío si no quiere cambiarla)':'Cree su clave (4 números)'}</label><input id="rgP1" class="pinin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••">
 <label for="rgP2">Repita la clave</label><input id="rgP2" class="pinin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••">
 <label class="rgchk"><input type="checkbox" id="rgK" ${u.nombre?'checked':''}><span>Acepto que OALE guarde mi nombre, celular y municipio solo para saber cuántas personas usan la app y poder contactarme. Puedo pedir que me los borren.</span></label>
 <button class="btn" data-c="regsave">${edit?'Guardar':'Entrar'}</button>${edit?'<button class="btn sec" data-c="regcancel">Cancelar</button>':'<div class="regold"><p>¿Ya usaba OALE en otro celular?</p><label class="btn sec rgfile">Ya usaba OALE: recuperar mis datos<input type="file" id="importFile" accept="application/json,.json" hidden></label></div>'}</div>`;
 r.hidden=false;
}
function regCard(){
 const u=db.meta.user;if(!u)return '';
 return `<div class="card"><b>Mi registro</b><div class="sub">${esc(u.nombre)} · ${esc(u.celular)}<br>${esc(u.municipio)}<br>${REG.url?(u.sent?'Registro enviado ✓':'Pendiente de enviar (falta internet)'):'Guardado en este celular'}</div><button class="btn sec sm" data-c="regedit">Cambiar mis datos</button></div>\n `;
}
function regSend(){
 const u=db.meta.user;if(!u||u.sent||!REG.url||!navigator.onLine||regSend.busy)return;regSend.busy=true;
 const E=REG.entries,b=new URLSearchParams();
 b.set(E.id,u.id);b.set(E.nombre,u.nombre);b.set(E.celular,u.celular);b.set(E.municipio,u.municipio);b.set(E.fecha,String(u.f).slice(0,10));
 fetch(REG.url,{method:'POST',mode:'no-cors',body:b}).then(()=>{u.sent=true;save(true);if(S.sub==='settings')render(true)}).catch(()=>{}).finally(()=>{regSend.busy=false});
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-c="regsave"],[data-c="regcancel"],[data-c="regedit"]');if(!el)return;const c=el.dataset.c;
 if(c==='regedit')return regShow(true);
 if(c==='regcancel'){$('reg').hidden=true;return}
 const nombre=$('rgN').value.trim(),cel=$('rgC').value.replace(/\D/g,''),mun=$('rgM').value.trim();
 if(nombre.length<3)return toast('Escriba su nombre completo',true);
 if(cel.length!==10)return toast('El celular debe tener 10 números',true);
 if(mun.length<3)return toast('Escriba su municipio y vereda',true);
 if(!$('rgK').checked)return toast('Debe aceptar para continuar',true);
 const o=db.meta.user||{},p1=($('rgP1')||{}).value||'',p2=($('rgP2')||{}).value||'',edit=!!o.nombre;
 if(!edit||p1||p2){if(!/^\d{4}$/.test(p1))return toast('La clave debe ser de 4 números',true);if(p1!==p2)return toast('Las dos claves no son iguales',true)}
 (async()=>{const salt=o.salt||Math.random().toString(36).slice(2),pin=p1?await hashPin(p1,salt):o.pin;
  db.meta.user={id:o.id||(crypto.randomUUID?crypto.randomUUID():'u'+Date.now()+Math.random().toString(36).slice(2,8)),nombre,celular:cel,municipio:mun,f:o.f||new Date().toISOString(),sent:false,salt,pin};
  S.auth=true;save();$('reg').hidden=true;toast('✓ Listo, '+nombre.split(' ')[0]);regSend()})();
});
window.addEventListener('online',regSend);
if(!db.meta.user)regShow(false);else regSend();

/* ================= INICIAR SESIÓN (clave de 4 números en este celular) ================= */
async function hashPin(pin,salt){const t=salt+':'+pin;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}
const pinFields=(a,b)=>`<label for="lgA">${a}</label><input id="lgA" class="pinin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••"><label for="lgB">${b}</label><input id="lgB" class="pinin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="••••">`;
function loginShow(){
 const u=db.meta.user,r=$('reg');
 r.innerHTML=`<div class="regbox"><div class="regmk">${MARK}</div><h2>Hola, ${esc(String(u.nombre||'').split(' ')[0])}</h2><p>Escriba su clave para entrar.</p>
 <input id="lgP" class="pinin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
 <button class="btn" data-c="lgenter">Entrar</button><button class="btn sec" data-c="lgforgot">Olvidé mi clave</button></div>`;
 r.hidden=false;
}
function pinSetupShow(){
 $('reg').innerHTML=`<div class="regbox"><div class="regmk">${MARK}</div><h2>Cree su clave</h2><p>Ahora OALE pide una clave para entrar. Escoja 4 números fáciles de recordar.</p>${pinFields('Clave (4 números)','Repita la clave')}<button class="btn" data-c="lgsetup">Guardar clave</button></div>`;
 $('reg').hidden=false;
}
function forgotShow(){
 $('reg').innerHTML=`<div class="regbox"><div class="regmk">${MARK}</div><h2>Olvidé mi clave</h2><p>Escriba el celular con el que se registró y cree una clave nueva.</p>
 <label for="lgC">Su número de celular</label><input id="lgC" type="tel" inputmode="numeric" maxlength="10" placeholder="3001234567">${pinFields('Clave nueva (4 números)','Repita la clave')}
 <button class="btn" data-c="lgreset">Cambiar clave</button><button class="btn sec" data-c="lgback">Volver</button></div>`;
}
function lgOpen(){S.auth=true;$('reg').hidden=true}
async function lgTry(){
 const u=db.meta.user,f=$('lgP');if(!f)return;
 if(S.lgUntil&&Date.now()<S.lgUntil)return toast('Espere un momento y vuelva a intentar',true);
 if((await hashPin(f.value,u.salt))===u.pin){S.lgFail=0;lgOpen();return}
 S.lgFail=(S.lgFail||0)+1;f.value='';
 if(S.lgFail>=5){S.lgUntil=Date.now()+30000;S.lgFail=0;toast('Demasiados intentos. Espere 30 segundos o toque "Olvidé mi clave"',true)}else toast('Clave incorrecta. Intente otra vez',true);
}
async function lgSavePin(){
 const a=$('lgA').value,b=$('lgB').value;
 if(!/^\d{4}$/.test(a)){toast('La clave debe ser de 4 números',true);return false}
 if(a!==b){toast('Las dos claves no son iguales',true);return false}
 const u=db.meta.user;u.salt=u.salt||Math.random().toString(36).slice(2);u.pin=await hashPin(a,u.salt);save();return true;
}
document.addEventListener('input',e=>{if(e.target.id==='lgP'&&e.target.value.length===4)lgTry()});
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-c="lgenter"],[data-c="lgforgot"],[data-c="lgsetup"],[data-c="lgreset"],[data-c="lgback"]');if(!el)return;const c=el.dataset.c;
 if(c==='lgenter')lgTry();
 else if(c==='lgforgot')forgotShow();
 else if(c==='lgback')loginShow();
 else if(c==='lgsetup'){if(await lgSavePin()){lgOpen();toast('✓ Clave guardada')}}
 else if(c==='lgreset'){
  const cel=$('lgC').value.replace(/\D/g,'');
  if(cel!==db.meta.user.celular)return toast('Ese celular no es el que se registró',true);
  if(await lgSavePin()){lgOpen();toast('✓ Clave nueva guardada')}
 }
});
{const u=db.meta.user;if(u){if(!u.pin)pinSetupShow();else loginShow()}}

/* ================= PRECIO DEL CAFÉ (Federación Nacional de Cafeteros) ================= */
function precioNow(){const m=db.meta.precio;return m&&m.carga>0&&m.fecha?m:{carga:2125000,fecha:'2026-10-14'}}
function kgSeco(){return precioNow().carga/125}
function precioCard(){
 const p=precioNow(),d=diffD(p.fecha,todayStr());
 return `<div class="precio"><div class="prh"><b>Precio del café</b><span>Federación Nacional de Cafeteros</span></div>
 <div class="prv">${fmt(p.carga)}</div><div class="prs">por carga de 125 kg de pergamino seco</div>
 <div class="prk">≈ ${fmt(Math.round(p.carga/125))} por kilo · ${p.manual?'escrito por usted':'precio de referencia'} del ${fDia(p.fecha)}</div>
 ${d>0?`<div class="prw">Este precio es de ${d===1?'ayer':'hace '+d+' días'}. Si ya sabe el de hoy, escríbalo.</div>`:''}
 <div class="prb"><button type="button" class="fbtn" data-c="prchange">Escribir el precio de hoy</button><a class="fbtn" href="https://federaciondecafeteros.org/publicaciones/" target="_blank" rel="noopener">Ver en la Federación</a></div>
 <p class="note">Puede variar según el punto de compra.</p></div>`;
}
function prShow(){
 $('reg').innerHTML=`<div class="regbox"><div class="regmk">${MARK}</div><h2>Precio de hoy</h2><p>Escriba el precio de la carga de 125 kg de pergamino seco que dice la Federación.</p>
 <label for="prIn">Precio por carga</label><input id="prIn" inputmode="numeric" autocomplete="off" placeholder="$ 2.125.000" value="${esc(fmt(precioNow().carga))}">
 <button class="btn" data-c="prsave">Guardar precio</button><button class="btn sec" data-c="prcancel">Cancelar</button></div>`;
 $('reg').hidden=false;
}
document.addEventListener('input',e=>{if(e.target.id==='prIn'){const dg=e.target.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,8);e.target.value=dg?fmt(Number(dg)):''}});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-c="prchange"],[data-c="prsave"],[data-c="prcancel"]');if(!el)return;const c=el.dataset.c;
 if(c==='prchange')return prShow();
 if(c==='prcancel'){$('reg').hidden=true;return}
 const v=Number($('prIn').value.replace(/\D/g,''));
 if(!(v>=500000&&v<=20000000))return toast('Revise el valor: el precio de la carga debe ser de varios millones',true);
 db.meta.precio={carga:v,fecha:todayStr(),manual:true};save();$('reg').hidden=true;render(true);toast('✓ Precio guardado');
});
async function precioFetch(){
 if(!navigator.onLine)return;
 try{const r=await fetch('precio.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
  if(!(j&&j.carga>0&&/^\d{4}-\d{2}-\d{2}$/.test(j.fecha)))return;
  const m=db.meta.precio;if(m&&m.fecha>j.fecha)return;
  if(m&&m.fecha===j.fecha&&m.carga===j.carga&&!m.manual)return;
  db.meta.precio={carga:j.carga,fecha:j.fecha,manual:false};save(true);
  if(S.tab==='home'&&!S.sub&&$('reg').hidden)render(true);
 }catch(e){}
}
window.addEventListener('online',precioFetch);setTimeout(precioFetch,1500);

/* ================= CONTADOR DE CELULARES (anónimo: solo suma uno la primera vez) ================= */
function contarInstalacion(){
 if(db.meta.contado||contarInstalacion.busy||!navigator.onLine)return;
 contarInstalacion.busy=true;
 fetch('https://abacus.jasoncameron.dev/hit/oale-cafe-colombia/instalaciones',{cache:'no-store'})
  .then(r=>{if(r.ok){db.meta.contado=true;save(true)}})
  .catch(()=>{}).finally(()=>{contarInstalacion.busy=false});
}
window.addEventListener('online',contarInstalacion);setTimeout(contarInstalacion,2500);

render();
</script>
